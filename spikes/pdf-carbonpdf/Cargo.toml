[package]
name = "pdf-carbonpdf-spike"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
carbonpdf = "0.2.0"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.small]
inherits = "release"
opt-level = "z"
