[package]
name = "apex-spike"
version = "0.0.0"
edition = "2021"
[dependencies]
apexbase = { version = "1.37.0", default-features = false }
arrow = { version = "59", default-features = false }
[workspace]
[profile.release]
strip = true
[profile.small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
